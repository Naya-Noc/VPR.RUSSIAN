<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Звёздный рейс · ВПР-8 по русскому</title>
<style>
:root{
  --bg:#0b0c1e; --panel:#15173a; --panel2:#1d2050; --line:#2c3070;
  --text:#eef0ff; --muted:#a3a8d6; --pink:#ff4fa3; --orange:#ffb347;
  --teal:#3de0d0; --violet:#8f7bff; --good:#45e08a; --bad:#ff6170;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;
  background:
   radial-gradient(1px 1px at 12% 18%,#fff8 50%,transparent 51%),
   radial-gradient(1px 1px at 72% 8%,#fff9 50%,transparent 51%),
   radial-gradient(1.5px 1.5px at 40% 60%,#fff6 50%,transparent 51%),
   radial-gradient(1px 1px at 88% 44%,#fff8 50%,transparent 51%),
   radial-gradient(1px 1px at 22% 82%,#fff7 50%,transparent 51%),
   radial-gradient(1.5px 1.5px at 60% 90%,#fff5 50%,transparent 51%),
   radial-gradient(900px 500px at 100% -10%,#ff4fa322,transparent 60%),
   radial-gradient(800px 600px at -10% 110%,#3de0d018,transparent 60%),
   var(--bg);
  background-attachment:fixed}
#app{max-width:680px;margin:0 auto;padding:16px 14px calc(40px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0 0 8px;line-height:1.2}
h1{font-size:24px;letter-spacing:.3px}
h2{font-size:20px}
h3{font-size:16px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.btn{appearance:none;border:0;border-radius:12px;padding:13px 18px;font:600 16px system-ui,sans-serif;color:#1a0b22;background:linear-gradient(90deg,var(--pink),var(--orange));cursor:pointer;width:100%;box-shadow:0 6px 20px #ff4fa333}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4;cursor:default;box-shadow:none}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.teal{background:linear-gradient(90deg,var(--teal),#7cf3a5);box-shadow:0 6px 20px #3de0d033}
.btn.small{width:auto;padding:8px 12px;font-size:14px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;cursor:pointer;padding:6px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;width:40px;height:40px;font-size:20px;cursor:pointer;flex:none}
.stat{flex:1;text-align:center;background:#0006;border:1px solid var(--line);border-radius:12px;padding:8px 4px}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--muted)}
.bar{height:8px;background:#0008;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--violet));border-radius:8px;transition:width .4s}
.bubble{position:relative;background:#fff;color:#1a1c3a;border-radius:14px;padding:10px 12px;font-size:15px;flex:1}
.bubble:before{content:"";position:absolute;left:-8px;top:18px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sector{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;text-align:left;color:var(--text);font:inherit;display:flex;gap:10px;align-items:center}
.sector:active{background:var(--panel2)}
.planet{width:38px;height:38px;border-radius:50%;flex:none;position:relative;box-shadow:inset -8px -6px 0 #0004}
.planet.ring:after{content:"";position:absolute;left:-7px;right:-7px;top:15px;height:7px;border:2px solid #fff8;border-radius:50%;transform:rotate(-18deg)}
.planet .n{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;color:#0b0c1e;font-size:15px}
.sector .t{font-weight:600;font-size:14px;line-height:1.2}
.sector .bar{margin-top:6px;height:5px}
.pill{display:inline-block;font-size:12px;padding:3px 8px;border-radius:20px;background:#ffffff14;border:1px solid var(--line);color:var(--muted)}
.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.prompt{font-weight:600;margin-bottom:12px}
.text-block{background:#0007;border:1px solid var(--line);border-radius:12px;padding:12px;line-height:2.1;font-size:17px}
.gap{display:inline-block;min-width:26px;padding:0 6px;margin:0 1px;border-radius:7px;border:1px dashed var(--orange);background:#ffb3471a;color:var(--orange);font:inherit;font-weight:700;cursor:pointer;line-height:1.5}
.gap.comma{min-width:16px;padding:0 3px;border-color:var(--violet);background:#8f7bff1a;color:#fff}
.gap.set{border-style:solid}
.gap.ok{border-color:var(--good);background:#45e08a26;color:var(--good)}
.gap.no{border-color:var(--bad);background:#ff617026;color:var(--bad)}
.fix{font-size:12px;color:var(--good);vertical-align:super;margin-left:1px}
.opt{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px 13px;margin-bottom:8px;font:inherit;cursor:pointer}
.opt.sel{border-color:var(--teal);background:#3de0d01c}
.opt.ok{border-color:var(--good);background:#45e08a22}
.opt.no{border-color:var(--bad);background:#ff617022}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:20px;padding:7px 11px;font:inherit;font-size:14px;cursor:pointer}
.chip.sel{border-color:var(--teal);background:#3de0d02a}
.chip.ok{border-color:var(--good);background:#45e08a2a}
.chip.no{border-color:var(--bad);background:#ff61702a}
.chip.miss{border-color:var(--good);border-style:dashed}
.field{margin-bottom:12px}
.field .lbl{font-size:13px;color:var(--muted);margin-bottom:5px}
.scheme{font:700 20px ui-monospace,Menlo,monospace;letter-spacing:1px;background:#0007;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;margin-bottom:12px;color:var(--teal)}
.sent{margin-bottom:6px}
input[type=text],textarea{width:100%;background:#0008;border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit;padding:10px 12px}
textarea{min-height:70px;resize:vertical}
.explain{margin-top:12px;border-radius:12px;padding:12px;background:#0007;border-left:4px solid var(--teal);font-size:15px}
.explain.good{border-left-color:var(--good)}
.explain.bad{border-left-color:var(--bad)}
.theory h3{color:var(--orange);margin-top:14px}
.theory ul{padding-left:20px;margin:6px 0 10px}
.theory li{margin-bottom:4px}
.theory b{color:var(--teal)}
.theory .ex{color:var(--muted);font-style:italic}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500}
.ach{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ach .ic{font-size:26px;width:40px;text-align:center;flex:none}
.ach.locked{opacity:.35;filter:grayscale(1)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--orange);color:var(--text);padding:12px 16px;border-radius:14px;z-index:20;box-shadow:0 10px 30px #0008;max-width:90vw;animation:pop .3s}
@keyframes pop{from{transform:translate(-50%,20px);opacity:0}}
.big{font-size:44px;font-weight:800;line-height:1}
.mark{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;font-size:34px;font-weight:800;color:#0b0c1e;background:linear-gradient(135deg,var(--teal),var(--violet))}
.days{display:flex;gap:4px}
.days i{flex:1;height:26px;border-radius:5px;background:#ffffff10}
.days i.on{background:linear-gradient(180deg,var(--orange),var(--pink))}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:30;padding:20px}
.modal .card{max-width:420px;width:100%}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   ЗВЁЗДНЫЙ РЕЙС · подготовка к ВПР по русскому языку, 8 класс
   Структура по образцу ВПР-2026 (ФИОКО): 10 заданий, 29 баллов
   ============================================================ */

const SCALE = [[0,14,2],[15,18,3],[19,23,4],[24,29,5]];
const MAX_TOTAL = 29;

const SECTORS = [
 {id:1, title:'Списывание', sub:'Орфография и пунктуация', max:9, color:'#ffb347', ring:false},
 {id:2, title:'Словосочетания', sub:'Виды подчинительной связи', max:5, color:'#ff7ac1', ring:false},
 {id:3, title:'Грамматическая основа', sub:'Подлежащее и сказуемое', max:1, color:'#3de0d0', ring:true},
 {id:4, title:'Односоставные', sub:'Типы односоставных предложений', max:1, color:'#8f7bff', ring:false},
 {id:5, title:'Однородные члены', sub:'Предложение по схеме', max:1, color:'#7cf3a5', ring:false},
 {id:6, title:'Обособленные определения', sub:'Найти и объяснить', max:3, color:'#ff6170', ring:true},
 {id:7, title:'Обособленные обстоятельства', sub:'Найти и объяснить', max:2, color:'#ffd86b', ring:false},
 {id:8, title:'Вводные слова', sub:'Найти и подобрать синоним', max:2, color:'#62b6ff', ring:false},
 {id:9, title:'Синтаксический разбор', sub:'Характеристика предложения', max:3, color:'#c58bff', ring:true},
 {id:10,title:'Грамматические ошибки', sub:'Найти и исправить', max:2, color:'#ff9a62', ring:false},
];

/* ---------------- ТЕОРИЯ ---------------- */
const THEORY = {
1:`<p>В ВПР нужно <b>списать текст целиком</b>: раскрыть скобки, вставить буквы и запятые. Здесь тренируем самые «опасные» места. Списывай медленно, по слогам, и проверяй каждую строчку.</p>
<h3>Безударные гласные</h3><ul><li>Подбери проверочное слово, чтобы гласная стала ударной: <span class="ex">к<b>а</b>менистый — к<b>а</b>мень, осл<b>а</b>бели — сл<b>а</b>бый</span>.</li><li>Словарные слова запоминаем.</li></ul>
<h3>Н и НН</h3><ul><li>Прилагательные: <b>-ан-, -ян-, -ин-</b> — одна Н (<span class="ex">кожаный, песчаный</span>); <b>-енн-, -онн-</b> и корень на Н + суффикс Н — две (<span class="ex">соломе<b>нн</b>ый, станцио<b>нн</b>ый, лимо<b>нн</b>ый</span>).</li><li>Исключения: стекля<b>нн</b>ый, оловя<b>нн</b>ый, деревя<b>нн</b>ый; ветре<b>н</b>ый.</li><li>Причастия: <b>НН</b>, если есть приставка, зависимое слово, суффикс -ова-/-ева- или совершенный вид (<span class="ex">скоше<b>нн</b>ая трава</span>). Краткие причастия — одна Н.</li></ul>
<h3>НЕ с разными частями речи</h3><ul><li>Слитно, если без НЕ не употребляется (<span class="ex">ненавидеть</span>) или можно заменить синонимом без НЕ (<span class="ex">невероятно = очень</span>).</li><li>С глаголами и деепричастиями — раздельно (<span class="ex">не могли</span>).</li><li>Раздельно при словах <b>ничем, нисколько, вовсе не, далеко не</b>: <span class="ex">ничем не примечательная</span>.</li><li><b>Несмотря на</b> (предлог) — слитно.</li></ul>
<h3>Запятые</h3><ul><li>Сложное предложение с союзами <b>и, но, а</b> — запятая между частями. Если у частей <b>общий второстепенный член</b> — запятой нет: <span class="ex">Вдали лаяла собака и шумел ветер.</span></li><li>Причастный оборот <b>после</b> определяемого слова — выделяется запятыми.</li><li>Деепричастный оборот и одиночное деепричастие — выделяются.</li><li>Вводные слова (<span class="ex">наверное, во-первых, казалось</span>) — выделяются.</li></ul>`,
2:`<p>Словосочетание = <b>главное слово + зависимое</b>, от главного задаём вопрос.</p>
<h3>Три вида связи</h3><ul>
<li><b>Согласование</b> — зависимое меняется вместе с главным (род, число, падеж). Зависимое: прилагательное, причастие, порядковое числительное, местоимение-прилагательное. <span class="ex">яркий свет → яркого света</span></li>
<li><b>Управление</b> — зависимое стоит в косвенном падеже и не меняется вместе с главным. Зависимое: существительное или местоимение (часто с предлогом). <span class="ex">читать книгу, подошёл к окну, письмо другу</span></li>
<li><b>Примыкание</b> — зависимое неизменяемое: наречие, деепричастие, инфинитив, притяжательные <b>его, её, их</b>. <span class="ex">очень быстро, шёл молча, желание учиться, его тетрадь</span></li></ul>
<h3>Это НЕ словосочетания</h3><ul><li>подлежащее + сказуемое (<span class="ex">звёзды светят</span>);</li><li>однородные члены (<span class="ex">мама и папа</span>);</li><li>предлог + слово (<span class="ex">к горизонту</span>);</li><li>сложная форма слова (<span class="ex">буду читать</span>).</li></ul>`,
3:`<h3>Подлежащее</h3><p>Отвечает на вопрос <b>кто? что?</b> Может быть выражено существительным, местоимением, числительным (<span class="ex">Семеро одного не ждут</span>), инфинитивом (<span class="ex">Учиться интересно</span>), неделимым сочетанием (<span class="ex">каждый из нас</span> → подлежащее <b>каждый</b>).</p>
<h3>Сказуемое</h3><ul><li><b>Простое глагольное</b>: один глагол в любой форме (<span class="ex">поднялся, буду читать</span>).</li><li><b>Составное глагольное</b>: вспомогательный глагол + инфинитив (<span class="ex">решили отправиться, хотел увидеть</span>).</li><li><b>Составное именное</b>: связка + именная часть (<span class="ex">стал врачом, был тихим</span>).</li></ul>
<p>Частица <b>не</b> входит в сказуемое. Однородные сказуемые выписываем все.</p>
<p>В односоставном предложении основа — один главный член: <span class="ex">Светает.</span></p>`,
4:`<p>В односоставном предложении один главный член. Задай себе вопрос: <b>кто делает действие?</b></p><ul>
<li><b>Назывное</b> — главный член подлежащее, говорится о существовании: <span class="ex">Зимний вечер. Тишина.</span></li>
<li><b>Определённо-личное</b> — глагол 1-го или 2-го лица, деятеля легко назвать (я, мы, ты, вы): <span class="ex">Иду по тропинке. Расскажи мне.</span></li>
<li><b>Неопределённо-личное</b> — глагол 3-го лица мн. числа или прошедшее мн. ч., деятель неизвестен: <span class="ex">В дверь постучали.</span></li>
<li><b>Обобщённо-личное</b> — действие относится к любому человеку, часто пословицы: <span class="ex">Цыплят по осени считают.</span></li>
<li><b>Безличное</b> — действие или состояние происходит само, деятеля нет и быть не может: <span class="ex">Темнеет. Мне не спится.</span></li></ul>`,
5:`<p>Однородные члены отвечают на один вопрос и относятся к одному слову. В схеме: <b>[ ]</b> — границы предложения, <b>О</b> — однородный член.</p>
<ul><li><b>[О, О и О]</b> — <span class="ex">Росли яблони, груши и сливы.</span></li>
<li><b>[О и О]</b> — одиночный союз И, запятой нет.</li>
<li><b>[и О, и О]</b>, <b>[ни О, ни О]</b>, <b>[то О, то О]</b> — повторяющиеся союзы, запятая перед вторым.</li>
<li><b>[О, но О]</b>, <b>[О, а О]</b>, <b>[не О, а О]</b> — противительные союзы, запятая всегда.</li>
<li><b>[не только О, но и О]</b> — двойной союз, запятая перед второй частью.</li></ul>`,
6:`<p>Нужно найти предложение с <b>обособленным согласованным определением</b> и объяснить, почему оно выделено запятыми.</p><ul>
<li><b>Причастный оборот после определяемого слова</b>: <span class="ex">Река, освещённая луной, блестела.</span> Перед словом — не обособляется: <span class="ex">Освещённая луной река…</span></li>
<li><b>Прилагательное с зависимыми словами после определяемого слова</b>: <span class="ex">Лес, полный звуков, просыпался.</span></li>
<li><b>Два и более одиночных определения после определяемого слова</b>: <span class="ex">Ночь, тёплая и тихая, опустилась.</span></li>
<li><b>Определение относится к личному местоимению</b> — обособляется всегда, даже перед ним: <span class="ex">Уставшие, мы уснули.</span></li></ul>
<p>Схема: <b>[ сущ., (прич. оборот), ... ]</b></p>
<p>Не путай с <b>деепричастным оборотом</b> (что делая? что сделав?) — это обстоятельство.</p>`,
7:`<p>Нужно найти предложение с <b>обособленным обстоятельством</b> и объяснить условие обособления.</p><ul>
<li><b>Деепричастный оборот</b> (что делая? что сделав?) — выделяется всегда: <span class="ex">Мы шли, собирая грибы.</span></li>
<li><b>Одиночное деепричастие</b> — обычно выделяется: <span class="ex">Улыбаясь, она протянула руку.</span></li>
<li><b>Обстоятельство с предлогом «несмотря на»</b> — выделяется: <span class="ex">Несмотря на дождь, мы пошли гулять.</span></li></ul>
<h3>Не обособляются</h3><ul><li>фразеологизмы: <span class="ex">не покладая рук, сломя голову, спустя рукава</span>;</li><li>деепричастия, ставшие наречиями: <span class="ex">молча, шутя, лёжа</span> (в значении «как?»).</li></ul>`,
8:`<p>Вводное слово выражает отношение говорящего и <b>не является членом предложения</b>: его можно убрать без потери смысла. Выделяется запятыми.</p>
<h3>Группы по значению (синоним ищи в той же группе!)</h3><ul>
<li><b>Уверенность</b>: конечно, разумеется, безусловно, несомненно</li>
<li><b>Неуверенность</b>: кажется, видимо, вероятно, может быть, наверное, возможно</li>
<li><b>Чувства</b>: к счастью, к радости, к сожалению, к удивлению</li>
<li><b>Источник сообщения</b>: по-моему, на мой взгляд, говорят, по слухам, по словам…</li>
<li><b>Порядок мыслей</b>: во-первых, прежде всего, во-вторых, итак, следовательно, например</li></ul>

const DAY=86400000;
function today(d=new Date()){const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)}
function dayDiff(a,b){return Math.round((new Date(b)-new Date(a))/DAY)}

function sectorAttempts(s){return S.attempts.filter(a=>a.s===s)}
function mastery(s){
  const at=sectorAttempts(s).slice(-8);
  if(!at.length) return null;
  const sum=at.reduce((x,a)=>x+a.score,0);
  return (sum+0.5)/(at.length+1);
}
function acc(s){const at=sectorAttempts(s).slice(-8);if(!at.length)return null;return at.reduce((x,a)=>x+a.score,0)/at.length}
function predicted(){
  let tot=0, known=0;
  for(const sec of SECTORS){const m=mastery(sec.id); if(m!==null){tot+=m*sec.max; known++;}}
  if(known<SECTORS.length) return null;
  return Math.round(tot);
}
function markFor(p){for(const [a,b,m] of SCALE) if(p>=a&&p<=b) return m; return 2}
const RANKS=[[0,'Юнга'],[100,'Кадет'],[250,'Пилот'],[500,'Штурман'],[850,'Капитан'],[1300,'Командор'],[2000,'Адмирал галактики']];
function rank(){let r=RANKS[0],next=null;for(let i=0;i<RANKS.length;i++){if(S.xp>=RANKS[i][0]){r=RANKS[i];next=RANKS[i+1]||null}}return {name:r[1],from:r[0],next}}

const BOXES=[0,1,2,4,8,16];
function srsUpdate(id,score){
  const cur=S.srs[id]||{box:0,due:0};
  if(score>=0.999){cur.box=Math.min(cur.box+1,BOXES.length-1)}else{cur.box=0}
  const days=score>=0.999?BOXES[cur.box]:1;
  cur.due=Date.now()+days*DAY-3600000;
  S.srs[id]=cur;
}
function seen(id){return !!S.srs[id]}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function itemsOf(s){return ITEMS.filter(i=>i.s===s)}
function pickFromSector(s,exclude){
  const pool=itemsOf(s).filter(i=>!exclude.has(i.id));
  if(!pool.length) return null;
  const now=Date.now();
  const unseen=pool.filter(i=>!seen(i.id));
  const due=pool.filter(i=>seen(i.id)&&S.srs[i.id].due<=now);
  if(due.length) return shuffle(due)[0];
  if(unseen.length) return shuffle(unseen)[0];
  return pool.slice().sort((a,b)=>S.srs[a.id].due-S.srs[b.id].due)[0];
}
function buildMission(n=8){
  const chosen=[], ex=new Set(), now=Date.now();
  // 1) повторение ошибок
  const due=shuffle(ITEMS.filter(i=>S.srs[i.id]&&S.srs[i.id].box===0&&S.srs[i.id].due<=now)).slice(0,3);
  due.forEach(i=>{chosen.push(i);ex.add(i.id)});
  // 2) слабые сектора с весом
  let guard=0;
  while(chosen.length<n&&guard++<200){
    const weights=SECTORS.map(sec=>{
      const m=mastery(sec.id); const w=((m===null?0.6:1-m)+0.15)*Math.sqrt(sec.max);
      const already=chosen.filter(c=>c.s===sec.id).length;
      if(sec.id===1&&already>=1) return 0;
      return w/(1+already*1.5);
    });
    const total=weights.reduce((a,b)=>a+b,0); let r=Math.random()*total, k=0;
    for(;k<weights.length;k++){r-=weights[k]; if(r<=0) break}
    const it=pickFromSector(SECTORS[Math.min(k,SECTORS.length-1)].id,ex);
    if(it){chosen.push(it);ex.add(it.id)}
  }
  // длинное списывание — в начало, пока свежая голова
  return chosen.sort((a,b)=>(a.s===1?-1:0)-(b.s===1?-1:0));
}
function buildDiag(){return SECTORS.map(sec=>shuffle(itemsOf(sec.id))[0])}
function buildPractice(s){const ex=new Set(),out=[];for(let i=0;i<5;i++){const it=pickFromSector(s,ex);if(!it)break;out.push(it);ex.add(it.id)}return out}

function h(tag,attrs={},...kids){
  const el=document.createElement(tag);
  for(const k in attrs){const v=attrs[k]; if(k==='class')el.className=v; else if(k==='html')el.innerHTML=v; else if(k.startsWith('on'))el.addEventListener(k.slice(2),v); else if(v!==false&&v!=null) el.setAttribute(k,v)}
  for(const c of kids.flat()){ if(c==null||c===false)continue; el.append(c.nodeType?c:document.createTextNode(c)) }
  return el;
}
function toast(msg){const t=h('div',{class:'toast',html:msg});document.body.append(t);setTimeout(()=>t.remove(),2600)}

/* ---------- Главный экран ---------- */
function home(){
  app.innerHTML='';
  const r=rank(); const td=today();
  const streakAlive=S.lastDay&&dayDiff(S.lastDay,td)<=1;
  const streak=streakAlive?S.streak:0;
  const doneToday=S.lastDay===td;
  const prog=r.next?Math.round((S.xp-r.from)/(r.next[0]-r.from)*100):100;

  app.append(h('div',{class:'row',style:'margin-bottom:14px'},
    h('div',{html:BOT,style:'flex:none'}),
    h('div',{class:'bubble'},doneToday?'Миссия дня выполнена! Можно полетать по секторам или отдохнуть.':HELLO[Math.floor(Math.random()*HELLO.length)])));

  app.append(h('div',{class:'card'},
    h('div',{class:'row between',style:'margin-bottom:8px'},h('div',{},h('div',{class:'small muted'},'Звание'),h('h3',{style:'margin:0'},r.name)),h('span',{class:'pill'},r.next?`до «${r.next[1]}» ${r.next[0]-S.xp} ✦`:'максимум')),
    h('div',{class:'bar'},h('i',{style:`width:${prog}%`})),
    h('div',{class:'row',style:'margin-top:12px'},
      h('div',{class:'stat'},h('b',{},'🔥 '+streak),h('span',{},'дней подряд')),
      h('div',{class:'stat'},h('b',{},'✦ '+S.xp),h('span',{},'звёздной пыли')),
      h('div',{class:'stat'},h('b',{},Object.keys(S.ach).length+'/'+ACH.length),h('span',{},'награды')))
  ));

  const p=predicted();
  const ready=h('div',{class:'card'});
  if(p===null){
    ready.append(h('h3',{},'🛰️ Разведка'),h('p',{class:'muted'},'Пройди короткую диагностику: по одному заданию из каждого номера ВПР. Так я узнаю, куда лететь в первую очередь.'),
      h('button',{class:'btn teal',onclick:()=>startSession('diag')},'Начать диагностику (≈15 мин)'));
  }else{
    const m=markFor(p);
    ready.append(h('div',{class:'row between'},
      h('div',{},h('div',{class:'small muted'},'Прогноз на ВПР'),h('div',{class:'big'},p+'/'+MAX_TOTAL),h('div',{class:'small muted'},'первичных баллов')),
      h('div',{class:'mark'},String(m))));
  }
  app.append(ready);

  app.append(h('button',{class:'btn',style:'margin-bottom:14px',onclick:()=>startSession('mission')},doneToday?'Ещё одна миссия ✦':'Миссия дня · 15–20 минут'));

  app.append(h('h3',{style:'margin:6px 2px 10px'},'Карта секторов (номера заданий ВПР)'));
  const g=h('div',{class:'grid'});
  for(const sec of SECTORS){
    const m=acc(sec.id);
    g.append(h('button',{class:'sector',onclick:()=>sectorScreen(sec.id)},planet(sec),
      h('div',{style:'flex:1;min-width:0'},h('div',{class:'t'},sec.title),
        h('div',{class:'bar'},h('i',{style:`width:${m===null?0:Math.round(m*100)}%`})))));
  }
  app.append(g);

  app.append(h('div',{class:'row wrap',style:'justify-content:center;margin-top:18px;gap:4px'},
    h('button',{class:'link',onclick:achScreen},'Награды'),
    h('button',{class:'link',onclick:reportScreen},'Отчёт для взрослого'),
    h('button',{class:'link',onclick:aboutScreen},'Как устроена ВПР')));

/* ---------- Сессия ---------- */
let SES=null;
function startSession(mode,sector){
  const items=mode==='diag'?buildDiag():mode==='practice'?buildPractice(sector):buildMission();
  SES={mode,sector,items,idx:0,results:[],start:Date.now(),xp:0,newAch:[]};
  showQuestion();
}
function quitSession(){
  if(SES&&SES.results.length) finishSession(true); else home();
}
function showQuestion(){
  const it=SES.items[SES.idx]; const sec=SECTORS.find(s=>s.id===it.s);
  app.innerHTML='';
  app.append(h('div',{class:'top'},h('button',{class:'back',onclick:()=>confirmBox('Прервать миссию? Решённые задания сохранятся.',quitSession),'aria-label':'Выйти'},'×'),
    h('div',{style:'flex:1'},h('div',{class:'bar'},h('i',{style:`width:${SES.idx/SES.items.length*100}%`})),h('div',{class:'small muted',style:'margin-top:4px'},`${SES.idx+1} из ${SES.items.length}`))));
  const card=h('div',{class:'card'});
  card.append(h('div',{class:'q-head'},h('div',{class:'row'},planet(sec,30),h('b',{},'Задание '+sec.id+' · '+sec.title)),
    h('button',{class:'link small',onclick:()=>showTheoryModal(sec.id)},'шпаргалка')));
  const body=h('div'); card.append(body);
  const foot=h('div',{style:'margin-top:14px'}); card.append(foot);
  app.append(card);
  RENDER[it.type](it,body,foot,(score,detail)=>onDone(it,score,detail,foot));
  window.scrollTo(0,0);
}
function onDone(it,score,detail,foot){
  score=Math.max(0,Math.min(1,score));
  S.attempts.push({id:it.id,s:it.s,score:+score.toFixed(3),ts:Date.now(),detail:detail||''});
  if(S.attempts.length>3000) S.attempts=S.attempts.slice(-3000);
  srsUpdate(it.id,score);
  const gain=Math.round(score*10)+(score>=0.999?5:0);
  SES.xp+=gain; S.xp+=gain;
  if(score>=0.999){S.run++; S.bestRun=Math.max(S.bestRun,S.run)}else S.run=0;
  if(S.run>=10&&unlock('sniper')) SES.newAch.push('sniper');
  SES.results.push(score);
  const d=today(); S.days[d]=S.days[d]||{min:0,items:0}; S.days[d].items++;
  save();
  foot.innerHTML='';
  foot.append(h('div',{class:'row between',style:'margin-bottom:10px'},h('span',{class:'pill'},score>=0.999?'Отлично! +'+gain+' ✦':'+'+gain+' ✦'),h('span',{class:'small muted'},Math.round(score*100)+'%')));
  foot.append(h('button',{class:'btn',onclick:()=>{SES.idx++; if(SES.idx<SES.items.length) showQuestion(); else finishSession(false)}},SES.idx+1<SES.items.length?'Дальше →':'Завершить'));
}
function finishSession(early){
  const d=today(), min=Math.max(1,Math.round((Date.now()-SES.start)/60000));
  S.days[d]=S.days[d]||{min:0,items:0}; S.days[d].min+=min;
  const avg=SES.results.length?SES.results.reduce((a,b)=>a+b,0)/SES.results.length:0;
  if(!early&&(SES.mode==='mission'||SES.mode==='diag')){
    if(S.lastDay!==d){ S.streak=(S.lastDay&&dayDiff(S.lastDay,d)===1)?S.streak+1:1; S.lastDay=d; }
    if(unlock('first')) SES.newAch.push('first');
    if(SES.mode==='diag'){S.diagDone=true; if(unlock('diag')) SES.newAch.push('diag')}
    if(avg>=0.999&&unlock('perfect')) SES.newAch.push('perfect');
  }
  if(S.streak>=3&&unlock('streak3')) SES.newAch.push('streak3');
  if(S.streak>=7&&unlock('streak7')) SES.newAch.push('streak7');
  if(S.streak>=14&&unlock('streak14')) SES.newAch.push('streak14');
  if(SECTORS.every(s=>sectorAttempts(s.id).length)&&unlock('explorer')) SES.newAch.push('explorer');
  if(S.xp>=500&&unlock('xp500')) SES.newAch.push('xp500');
  const p=predicted(); if(p!==null&&markFor(p)===5&&unlock('mark5')) SES.newAch.push('mark5');
  save();

  app.innerHTML='';
  const title=early?'Миссия прервана':SES.mode==='diag'?'Разведка завершена!':'Миссия выполнена!';
  app.append(h('div',{class:'row',style:'margin-bottom:14px'},h('div',{html:BOT}),h('div',{class:'bubble'},
    avg>=0.85?'Это было мощно, капитан! 🚀':avg>=0.6?'Хороший полёт. Ошибки я запомнил — вернём их на повторение.':'Ничего, в космосе всё решает тренировка. Ошибки вернутся на повторение завтра.')));
  const c=h('div',{class:'card'},h('h2',{},title),
    h('div',{class:'row',style:'margin:10px 0'},
      h('div',{class:'stat'},h('b',{},Math.round(avg*100)+'%'),h('span',{},'точность')),
      h('div',{class:'stat'},h('b',{},'+'+SES.xp+' ✦'),h('span',{},'пыли')),
      h('div',{class:'stat'},h('b',{},min+' мин'),h('span',{},'в полёте'))));
  if(SES.newAch.length){
    c.append(h('h3',{style:'margin-top:10px'},'Новые награды'));
    for(const id of SES.newAch){const a=ACH.find(x=>x[0]===id);c.append(h('div',{class:'ach'},h('div',{class:'ic'},a[1]),h('div',{},h('b',{},a[2]),h('div',{class:'small muted'},a[3]))))}
  }
  app.append(c);
  if(SES.mode==='diag'&&p!==null){
    const weak=SECTORS.map(s=>({s,m:mastery(s.id)})).sort((a,b)=>a.m-b.m).slice(0,3);
    app.append(h('div',{class:'card'},h('h3',{},'Слабые места'),h('p',{class:'muted small'},'Миссии дня будут чаще вести сюда:'),
      ...weak.map(w=>h('div',{class:'row',style:'margin-bottom:8px'},planet(w.s,28),h('span',{},w.s.title)))));
  }
  app.append(h('button',{class:'btn',onclick:home},'На мостик'));
  SES=null;
  window.scrollTo(0,0);
}

/* ---------- Рендеры типов заданий ---------- */
const RENDER={
gaps(it,body,foot,done){
  body.append(h('div',{class:'prompt'},'Вставь пропущенные буквы, выбери написание и расставь запятые. Нажимай на ячейки — варианты переключаются.'),
    h('div',{class:'small muted',style:'margin-bottom:8px'},'«'+it.title+'». Оранжевые ячейки — буквы и написание, фиолетовые точки — возможная запятая.'));
  const box=h('div',{class:'text-block'});
  const gaps=[]; let last=0; const re=/\{([^}]*)\}/g; let m;
  while((m=re.exec(it.text))){
    box.append(document.createTextNode(it.text.slice(last,m.index)));
    let [core,rule]=m[1].split('#');
    let g;
    if(core===','||core==='_'){
      g={kind:'comma',correct:core===',',val:false,rule};
      g.el=h('button',{class:'gap comma'},'·');
      g.el.onclick=()=>{if(g.locked)return;g.val=!g.val;g.el.textContent=g.val?',':'·';g.el.classList.toggle('set',g.val)};
    }else{
      const opts=core.split('|'); const correct=opts.find(o=>o.startsWith('*')).slice(1);
      const list=shuffle(opts.map(o=>o.replace(/^\*/,'')));
      g={kind:'opt',correct,list,i:-1,rule};
      g.el=h('button',{class:'gap'},'?');
      g.el.onclick=()=>{if(g.locked)return;g.i=(g.i+1)%list.length;g.el.textContent=list[g.i];g.el.classList.add('set')};
    }
    gaps.push(g); box.append(g.el); last=re.lastIndex;
  }
  box.append(document.createTextNode(it.text.slice(last)));
  body.append(box);
  const btn=h('button',{class:'btn',onclick:()=>{
    const unset=gaps.filter(g=>g.kind==='opt'&&g.i<0).length;
    if(unset&&!btn.dataset.warned){btn.dataset.warned=1;btn.textContent=`Не заполнено ячеек: ${unset}. Проверить всё равно?`;return}
    let ok=0; const wrong=[];
    for(const g of gaps){
      g.locked=true;
      const val=g.kind==='comma'?g.val:(g.i<0?null:g.list[g.i]);
      const right=g.kind==='comma'?val===g.correct:val===g.correct;
      if(right){ok++;g.el.classList.add('ok')}else{
        g.el.classList.add('no');
        if(g.kind==='comma'){g.el.innerHTML=g.correct?'<span style="color:var(--good)">,</span>':'<s>,</s>'}
        else{g.el.innerHTML=`<s style="opacity:.7">${esc(val==null?'?':val)}</s> <span style="color:var(--good)">${esc(g.correct)}</span>`}
        if(g.rule) wrong.push(g.rule);
      }
    }
    const score=ok/gaps.length;
    const uniq=[...new Set(wrong)];
    body.append(h('div',{class:'explain '+(score>=0.999?'good':'bad'),html:
      `<b>Верно ${ok} из ${gaps.length}.</b>`+(uniq.length?'<br>Повтори правила:<ul style="margin:6px 0 0;padding-left:18px">'+uniq.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ul>':'')+
      '<div class="small muted" style="margin-top:6px">На ВПР этот текст нужно будет списать целиком, аккуратно и без пропусков.</div>'}));
    done(score,uniq.join('; '));
  }},'Проверить');
  foot.append(btn);
},
classify(it,body,foot,done){
  body.append(h('div',{class:'prompt'},'Определи вид подчинительной связи. Если это не подчинительное словосочетание — отметь последний вариант.'));
  const rows=it.phrases.map(([p,a])=>{
    const r={a,val:null,btns:[]};
    const chips=h('div',{class:'chips'});
    CLASS_OPTS.forEach(([k,l])=>{const b=h('button',{class:'chip'},l);b.onclick=()=>{if(r.locked)return;r.val=k;r.btns.forEach(x=>x.classList.toggle('sel',x===b))};b.dataset.k=k;r.btns.push(b);chips.append(b)});
    body.append(h('div',{class:'field'},h('div',{style:'font-weight:600;margin-bottom:6px'},p),chips));
    r.p=p; return r;
  });
  const btn=h('button',{class:'btn',onclick:()=>{
    if(rows.some(r=>!r.val)){toast('Отметь все четыре словосочетания');return}
    let ok=0; const wrong=[];
    rows.forEach(r=>{r.locked=true;r.btns.forEach(b=>{b.classList.remove('sel');if(b.dataset.k===r.a)b.classList.add(r.val===r.a?'ok':'miss');else if(b.dataset.k===r.val)b.classList.add('no')});if(r.val===r.a)ok++;else wrong.push(r.p)});
    body.append(h('div',{class:'explain '+(ok===4?'good':'bad'),html:`<b>Верно ${ok} из 4.</b> Помни: согласование — зависимое меняется вместе с главным; управление — зависимое в косвенном падеже; примыкание — зависимое не изменяется (наречие, инфинитив, деепричастие, его/её/их).`}));
    done(ok/4,wrong.join(', '));
    btn.remove();
  }},'Проверить');
  foot.append(btn);
},
tokens(it,body,foot,done){
  body.append(h('div',{class:'prompt'},'Нажми на слова, из которых состоит грамматическая основа.'));
  const words=it.sentence.split(' ');
  const clean=w=>w.replace(/[.,!?:;—«»]/g,'');
  const need=new Set(); const used=new Set();
  it.answer.forEach(a=>{const i=words.findIndex((w,j)=>!used.has(j)&&clean(w)===a);if(i>=0){need.add(i);used.add(i)}});
  const sel=new Set(); const chips=h('div',{class:'chips',style:'font-size:17px'});
  const els=words.map((w,i)=>{const b=h('button',{class:'chip'},clean(w));b.onclick=()=>{if(b.dataset.l)return;sel.has(i)?sel.delete(i):sel.add(i);b.classList.toggle('sel',sel.has(i))};chips.append(b);return b});
  body.append(h('div',{class:'text-block',style:'line-height:1.5;margin-bottom:10px'},it.sentence),chips);
  const btn=h('button',{class:'btn',onclick:()=>{
    if(!sel.size){toast('Выбери хотя бы одно слово');return}
    let right=true;
    els.forEach((b,i)=>{b.dataset.l=1;b.classList.remove('sel');const n=need.has(i),s=sel.has(i);if(!n&&clean(words[i]).toLowerCase()==='и'){if(s)b.classList.add('ok');return}if(n&&s)b.classList.add('ok');else if(n&&!s){b.classList.add('miss');right=false}else if(!n&&s){b.classList.add('no');right=false}});
    body.append(h('div',{class:'explain '+(right?'good':'bad'),html:(right?'<b>Точно в цель!</b> ':'<b>Не совсем.</b> ')+it.explain}));
    done(right?1:0,right?'':it.sentence);
    btn.remove();
  }},'Проверить');
  foot.append(btn);
},
one(it,body,foot,done){
  body.append(h('div',{class:'prompt'},'Определи тип односоставного предложения.'),h('div',{class:'text-block',style:'line-height:1.5;margin-bottom:12px'},it.sentence));
  const opts=ONE_OPTS.map(([k,l])=>{const b=h('button',{class:'opt'},l);b.onclick=()=>pick(k,b);body.append(b);return [k,b]});
  function pick(k,b){
    if(body.dataset.l)return; body.dataset.l=1;
    opts.forEach(([kk,bb])=>{if(kk===it.answer)bb.classList.add('ok');else if(bb===b)bb.classList.add('no')});
    const ok=k===it.answer;
    body.append(h('div',{class:'explain '+(ok?'good':'bad'),html:(ok?'<b>Верно!</b> ':'<b>Правильный ответ: '+ONE_OPTS.find(o=>o[0]===it.answer)[1].toLowerCase()+'.</b> ')+esc(it.explain)}));
    done(ok?1:0,ok?'':it.sentence);
  }
},
scheme(it,body,foot,done){
  body.append(h('div',{class:'prompt'},'Какое предложение соответствует схеме?'),h('div',{class:'scheme'},it.scheme));
  const order=shuffle(it.options.map((t,i)=>i));
  const bs=order.map(i=>{const b=h('button',{class:'opt'},it.options[i]);b.onclick=()=>pick(i,b);body.append(b);return [i,b]});
  function pick(i,b){
    if(body.dataset.l)return; body.dataset.l=1;
    bs.forEach(([ii,bb])=>{if(ii===it.answer)bb.classList.add('ok');else if(bb===b)bb.classList.add('no')});
    const ok=i===it.answer;
    body.append(h('div',{class:'explain '+(ok?'good':'bad'),html:(ok?'<b>Верно!</b> ':'<b>Не то.</b> ')+esc(it.explain)}));
    done(ok?1:0,ok?'':it.scheme);
  }
},
reason(it,body,foot,done){
  const what=it.s===6?'обособленным согласованным определением':'обособленным обстоятельством';
  body.append(h('div',{class:'prompt'},`1) Найди предложение с ${what}.`));
  let sSel=null,rSel=null;
  const sb=it.sentences.map((t,i)=>{const b=h('button',{class:'opt'},`(${i+1}) ${t}`);b.onclick=()=>{if(body.dataset.l)return;sSel=i;sb.forEach(x=>x.classList.toggle('sel',x===b))};body.append(b);return b});
  body.append(h('div',{class:'prompt',style:'margin-top:14px'},'2) Почему оно обособлено?'));
  const order=shuffle(it.reasons.map((r,i)=>i));
  const rb=order.map(i=>{const b=h('button',{class:'opt'},it.reasons[i]);b.dataset.i=i;b.onclick=()=>{if(body.dataset.l)return;rSel=i;rb.forEach(x=>x.classList.toggle('sel',x===b))};body.append(b);return b});
  const btn=h('button',{class:'btn',onclick:()=>{
    if(sSel===null||rSel===null){toast('Выбери предложение и объяснение');return}
    body.dataset.l=1;
    sb.forEach((b,i)=>{b.classList.remove('sel');if(i===it.answer)b.classList.add('ok');else if(i===sSel)b.classList.add('no')});
    rb.forEach(b=>{const i=+b.dataset.i;b.classList.remove('sel');if(i===it.reasonAnswer)b.classList.add('ok');else if(i===rSel)b.classList.add('no')});
    const sc=(sSel===it.answer?0.5:0)+(rSel===it.reasonAnswer?0.5:0);
    body.append(h('div',{class:'explain '+(sc>=1?'good':'bad'),html:'<b>Как записать ответ на ВПР:</b> '+esc(it.model)}));
    done(sc,sc>=1?'':it.sentences[it.answer]);
    btn.remove();
  }},'Проверить');
  foot.append(btn);
},
intro(it,body,foot,done){
  body.append(h('div',{class:'prompt'},'1) Найди предложение с вводным словом.'));
  let sSel=null,ySel=null;
  const sb=it.sentences.map((t,i)=>{const b=h('button',{class:'opt'},`(${i+1}) ${t}`);b.onclick=()=>{if(body.dataset.l)return;sSel=i;sb.forEach(x=>x.classList.toggle('sel',x===b))};body.append(b);return b});
  body.append(h('div',{class:'prompt',style:'margin-top:14px'},'2) Выпиши вводное слово (сочетание).'));
  const inp=h('input',{type:'text',placeholder:'например: наверное',autocomplete:'off',autocapitalize:'off'}); body.append(inp);
  body.append(h('div',{class:'prompt',style:'margin-top:14px'},'3) Выбери синоним из той же группы по значению.'));
  const chips=h('div',{class:'chips'});
  const yb=it.syn.map((t,i)=>{const b=h('button',{class:'chip'},t);b.onclick=()=>{if(body.dataset.l)return;ySel=i;yb.forEach(x=>x.classList.toggle('sel',x===b))};chips.append(b);return b});
  body.append(chips);
  const btn=h('button',{class:'btn',onclick:()=>{
    if(sSel===null||ySel===null||!inp.value.trim()){toast('Выполни все три шага');return}
    body.dataset.l=1; inp.disabled=true;
    const norm=s=>s.toLowerCase().replace(/ё/g,'е').replace(/[.,!?«»]/g,'').replace(/\s+/g,' ').trim();
    const wOk=it.word.some(w=>norm(w)===norm(inp.value));
    inp.style.borderColor=wOk?'var(--good)':'var(--bad)';
    sb.forEach((b,i)=>{b.classList.remove('sel');if(i===it.answer)b.classList.add('ok');else if(i===sSel)b.classList.add('no')});
    yb.forEach((b,i)=>{b.classList.remove('sel');if(i===it.synAnswer)b.classList.add('ok');else if(i===ySel)b.classList.add('no')});
    const sc=((sSel===it.answer)+wOk+(ySel===it.synAnswer))/3;
    body.append(h('div',{class:'explain '+(sc>=1?'good':'bad'),html:(wOk?'':'Вводное слово: <b>'+esc(it.word[0])+'</b>. ')+it.explain}));
    done(sc,sc>=1?'':it.sentences[it.answer]);
    btn.remove();
  }},'Проверить');
  foot.append(btn);
},
parse(it,body,foot,done){
  body.append(h('div',{class:'prompt'},'Охарактеризуй предложение.'),h('div',{class:'text-block',style:'line-height:1.5;margin-bottom:12px'},it.sentence));
  const vals=PARSE_FIELDS.map(()=>null); const allBtns=[];
  PARSE_FIELDS.forEach(([lbl,opts],fi)=>{
    const chips=h('div',{class:'chips'}); const btns=[];
    opts.forEach(([k,l])=>{const b=h('button',{class:'chip'},l);b.dataset.k=k;b.onclick=()=>{if(body.dataset.l)return;vals[fi]=k;btns.forEach(x=>x.classList.toggle('sel',x===b))};btns.push(b);chips.append(b)});
    allBtns.push(btns);
    body.append(h('div',{class:'field'},h('div',{class:'lbl'},lbl),chips));
  });
  const btn=h('button',{class:'btn',onclick:()=>{
    if(vals.some(v=>v===null)){toast('Заполни все пункты');return}
    body.dataset.l=1; let ok=0;
    allBtns.forEach((btns,fi)=>{const a=it.answer[fi];btns.forEach(b=>{b.classList.remove('sel');if(b.dataset.k===a)b.classList.add(vals[fi]===a?'ok':'miss');else if(b.dataset.k===vals[fi])b.classList.add('no')});if(vals[fi]===a)ok++});
    const sc=ok/PARSE_FIELDS.length;
    body.append(h('div',{class:'explain '+(sc>=1?'good':'bad'),html:`<b>Верно ${ok} из ${PARSE_FIELDS.length}.</b> `+esc(it.explain)}));
    done(sc,sc>=1?'':it.sentence);
    btn.remove();
  }},'Проверить');
  foot.append(btn);
},
errors(it,body,foot,done){
  body.append(h('div',{class:'prompt'},'1) Отметь предложения с грамматической ошибкой.'));
  const sel=new Set();
  const sb=it.sents.map((x,i)=>{const b=h('button',{class:'opt'},`(${i+1}) ${x[0]}`);b.onclick=()=>{if(body.dataset.l)return;sel.has(i)?sel.delete(i):sel.add(i);b.classList.toggle('sel',sel.has(i))};body.append(b);return b});
  body.append(h('div',{class:'prompt',style:'margin-top:14px'},'2) Запиши исправленный вариант.'));
  const ta=h('textarea',{placeholder:'Исправленное предложение…'}); body.append(ta);
  const btn=h('button',{class:'btn',onclick:()=>{
    if(!sel.size){toast('Отметь хотя бы одно предложение');return}
    if(!ta.value.trim()){toast('Запиши исправление — так же, как на ВПР');return}
    body.dataset.l=1; ta.disabled=true;
    let selOk=true;
    sb.forEach((b,i)=>{b.classList.remove('sel');const bad=!it.sents[i][1];if(bad&&sel.has(i))b.classList.add('ok');else if(bad){b.classList.add('ok');selOk=false}else if(sel.has(i)){b.classList.add('no');selOk=false}});
    const fixes=it.sents.filter(x=>!x[1]).map(x=>'✓ '+esc(x[2])).join('<br>');
    body.append(h('div',{class:'explain '+(selOk?'good':'bad'),html:(selOk?'<b>Ошибки найдены верно.</b>':'<b>Ошибки были здесь (зелёные).</b>')+'<br>'+it.explain+'<div style="margin-top:8px"><b>Образец исправления:</b><br>'+fixes+'</div>'}));
    btn.remove();
    const q=h('div',{class:'card',style:'margin:12px 0 0;padding:12px'},h('div',{style:'font-weight:600;margin-bottom:8px'},'Сравни своё исправление с образцом. Ошибка исправлена правильно?'));
    const row=h('div',{class:'row'});
    const fin=v=>{q.remove();done((selOk?0.5:0)+(v?0.5:0),selOk&&v?'':it.sents.find(x=>!x[1])[0])};
    row.append(h('button',{class:'btn teal small',style:'flex:1',onclick:()=>fin(true)},'Да, верно'),h('button',{class:'btn ghost small',style:'flex:1',onclick:()=>fin(false)},'Нет / не всё'));
    q.append(row); foot.append(q);
  }},'Проверить');
  foot.append(btn);
}
};

function confirmBox(text,yes){
  const m=h('div',{class:'modal'},h('div',{class:'card'},h('p',{},text),h('div',{class:'row'},
    h('button',{class:'btn ghost small',style:'flex:1',onclick:()=>m.remove()},'Отмена'),

/* ---------- Отчёт для взрослого ---------- */
function reportScreen(){
  app.innerHTML=''; app.append(topbar('Отчёт для взрослого',home));
  const p=predicted(), td=today();
  const daysList=[]; for(let i=13;i>=0;i--){daysList.push(today(new Date(Date.now()-i*DAY)))}
  const active=Object.keys(S.days).length;
  const totalMin=Object.values(S.days).reduce((a,d)=>a+d.min,0);
  const streak=S.lastDay&&dayDiff(S.lastDay,td)<=1?S.streak:0;

  const sum=h('div',{class:'card'},
    h('div',{class:'row between'},h('div',{},h('div',{class:'small muted'},'Прогноз на ВПР (по шкале 2026 г.)'),h('div',{class:'big'},p===null?'—':p+'/'+MAX_TOTAL),h('div',{class:'small muted'},p===null?'нужна диагностика':'отметка «'+markFor(p)+'»')),p!==null?h('div',{class:'mark'},String(markFor(p))):null),
    h('div',{class:'row',style:'margin-top:12px'},
      h('div',{class:'stat'},h('b',{},String(active)),h('span',{},'дней занятий')),
      h('div',{class:'stat'},h('b',{},String(streak)),h('span',{},'подряд сейчас')),
      h('div',{class:'stat'},h('b',{},totalMin+' мин'),h('span',{},'всего'))),
    h('div',{class:'small muted',style:'margin:12px 0 6px'},'Последние 14 дней'),
    h('div',{class:'days'},...daysList.map(d=>h('i',{class:S.days[d]?'on':'',title:d+(S.days[d]?` · ${S.days[d].items} заданий, ${S.days[d].min} мин`:'')}))));
  app.append(sum);

  const tbl=h('table',{},h('tr',{},h('th',{},'№'),h('th',{},'Задание'),h('th',{},'Решено'),h('th',{},'Освоено')));
  SECTORS.forEach(s=>{const m=acc(s.id);tbl.append(h('tr',{},h('td',{},String(s.id)),h('td',{},s.title),h('td',{},String(sectorAttempts(s.id).length)),h('td',{},m===null?'—':h('span',{style:`color:${m>=0.8?'var(--good)':m>=0.55?'var(--orange)':'var(--bad)'}`},Math.round(m*100)+'%'))))});
  app.append(h('div',{class:'card'},h('h3',{},'По номерам заданий'),tbl,h('div',{class:'small muted',style:'margin-top:8px'},'«Освоено» — средний результат последних 8 попыток. Зелёный ≥ 80%, оранжевый 55–79%, красный — нужно внимание.')));

  const errs=S.attempts.filter(a=>a.score<0.999).slice(-12).reverse();
  const el=h('div',{class:'card'},h('h3',{},'Последние ошибки'));
  if(!errs.length) el.append(h('p',{class:'muted'},'Ошибок пока нет.'));
  errs.forEach(a=>{const s=SECTORS[a.s-1];el.append(h('div',{style:'padding:8px 0;border-bottom:1px solid var(--line)'},h('div',{class:'small muted'},new Date(a.ts).toLocaleDateString('ru-RU')+' · №'+s.id+' '+s.title+' · '+Math.round(a.score*100)+'%'),a.detail?h('div',{class:'small'},a.detail):null))});
  app.append(el);

  app.append(h('button',{class:'btn teal',style:'margin-bottom:10px',onclick:()=>copyReport()},'Скопировать отчёт текстом'));
  app.append(h('div',{style:'text-align:center'},h('button',{class:'link small',onclick:()=>confirmBox('Стереть весь прогресс? Это нельзя отменить.',()=>{S=blank();save();home()})},'Сбросить прогресс')));
}
function copyReport(){
  const p=predicted();
  const lines=['Звёздный рейс — отчёт ВПР-8, русский язык',`Дата: ${new Date().toLocaleDateString('ru-RU')}`,
    `Прогноз: ${p===null?'нет данных (не пройдена диагностика)':p+'/'+MAX_TOTAL+', отметка «'+markFor(p)+'»'}`,
    `Дней занятий: ${Object.keys(S.days).length}, всего минут: ${Object.values(S.days).reduce((a,d)=>a+d.min,0)}`,'',
    'По заданиям:',...SECTORS.map(s=>{const m=mastery(s.id);return `№${s.id} ${s.title}: ${m===null?'—':Math.round(m*100)+'%'} (решено ${sectorAttempts(s.id).length})`})];
  const txt=lines.join('\n');
  const fallback=()=>{const t=h('textarea',{style:'position:fixed;opacity:0'});t.value=txt;document.body.append(t);t.select();try{document.execCommand('copy')}catch(e){};t.remove();toast('Отчёт скопирован')};
  try{navigator.clipboard.writeText(txt).then(()=>toast('Отчёт скопирован'),fallback)}catch(e){fallback()}
}
